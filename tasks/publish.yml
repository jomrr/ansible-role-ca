---
# role: ca
# file: tasks/publish.yml

- name: "CA | Assert publish targets exist in inventory"
  ansible.builtin.assert:
    that:
      - __ca_publish_target.name in hostvars
    fail_msg: "Publish target {{ __ca_publish_target.name }} must reference an existing inventory host."
    quiet: true
  loop: "{{ ca_publish_targets }}"
  loop_control:
    loop_var: __ca_publish_target
    label: "{{ __ca_publish_target.name }}"

- name: "CA | Create publish directories"
  become: "{{ __ca_publish_pair.0.become | default(false) | bool }}"
  become_user: "{{ __ca_publish_pair.0.become_user | default('root') }}"
  ansible.builtin.file:
    path: >-
      {{
        __ca_publish_pair.0.path | regex_replace('/+$', '')
      }}{{ ('/' ~ __ca_publish_pair.1) if __ca_publish_pair.1 else '' }}
    state: directory
    owner: "{{ __ca_publish_pair.0.owner | default(ca_owner) }}"
    group: "{{ __ca_publish_pair.0.group | default(ca_group) }}"
    mode: "{{ __ca_publish_pair.0.directory_mode | default(ca_publish_directory_mode) }}"
  loop: "{{ ca_publish_targets | product(['', 'aia', 'crl']) | list }}"
  loop_control:
    loop_var: __ca_publish_pair
    label: "{{ __ca_publish_pair.0.name }}/{{ __ca_publish_pair.1 | default('webroot', true) }}"
  delegate_to: "{{ __ca_publish_pair.0.name }}"

- name: "CA | Publish artifacts directly on the CA host"
  become: "{{ __ca_publish_target.become | default(false) | bool }}"
  become_user: "{{ __ca_publish_target.become_user | default('root') }}"
  jomrr.ca.publish:
    base_dir: "{{ ca_base_dir }}"
    dest: "{{ __ca_publish_target.path }}"
    authorities: "{{ ca_authorities }}"
    owner: "{{ __ca_publish_target.owner | default(ca_owner) }}"
    group: "{{ __ca_publish_target.group | default(ca_group) }}"
    mode: "{{ __ca_publish_target.mode | default(ca_publish_mode) }}"
  loop: "{{ ca_publish_targets | selectattr('name', 'equalto', inventory_hostname) | list }}"
  loop_control:
    loop_var: __ca_publish_target
    label: "{{ __ca_publish_target.name }}"

- name: "CA | Transfer artifacts to other inventory hosts"
  when: __ca_publish_remote_targets | length > 0
  vars:
    __ca_publish_remote_targets: "{{ ca_publish_targets | rejectattr('name', 'equalto', inventory_hostname) | list }}"
    __ca_publish_modes: "{{ __ca_publish_remote_targets | map(attribute='mode', default=ca_publish_mode) | unique | list }}"
  block:
    - name: "CA | Create remote publish staging directory"
      become: true
      become_user: "{{ ca_owner }}"
      ansible.builtin.tempfile:
        state: directory
        prefix: "ca-publish-{{ ca_name | lower }}-"
      register: __ca_publish_remote_stage
      check_mode: false
      changed_when: false

    - name: "CA | Create remote publish archive"
      become: true
      become_user: "{{ ca_owner }}"
      jomrr.ca.publish_archive:
        base_dir: "{{ ca_base_dir }}"
        dest: "{{ __ca_publish_remote_stage.path }}/public-{{ __ca_publish_file_mode }}.tar"
        authorities: "{{ ca_authorities }}"
        artifact_mode: "{{ __ca_publish_file_mode }}"
        owner: "{{ ca_owner }}"
        group: "{{ ca_group }}"
        mode: "0600"
      loop: "{{ __ca_publish_modes }}"
      loop_control:
        loop_var: __ca_publish_file_mode
      check_mode: false
      changed_when: false

    - name: "CA | Create local publish staging directory"
      ansible.builtin.tempfile:
        state: directory
        prefix: "ca-publish-{{ ca_name | lower }}-"
      register: __ca_publish_stage
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: "CA | Stage publish archive on controller"
      become: true
      become_user: "{{ ca_owner }}"
      ansible.builtin.fetch:
        src: "{{ __ca_publish_remote_stage.path }}/public-{{ __ca_publish_file_mode }}.tar"
        dest: "{{ __ca_publish_stage.path }}/public-{{ __ca_publish_file_mode }}.tar"
        flat: true
      loop: "{{ __ca_publish_modes }}"
      loop_control:
        loop_var: __ca_publish_file_mode
      check_mode: false
      changed_when: false

    - name: "CA | Publish artifact archive"
      become: "{{ __ca_publish_target.become | default(false) | bool }}"
      become_user: "{{ __ca_publish_target.become_user | default('root') }}"
      ansible.builtin.unarchive:
        src: "{{ __ca_publish_stage.path }}/public-{{ __ca_publish_target.mode | default(ca_publish_mode) }}.tar"
        dest: "{{ __ca_publish_target.path | regex_replace('/+$', '') }}"
        owner: "{{ __ca_publish_target.owner | default(ca_owner) }}"
        group: "{{ __ca_publish_target.group | default(ca_group) }}"
      loop: "{{ __ca_publish_remote_targets }}"
      loop_control:
        loop_var: __ca_publish_target
        label: "{{ __ca_publish_target.name }}"
      delegate_to: "{{ __ca_publish_target.name }}"
  always:
    - name: "CA | Remove local publish staging directory"
      ansible.builtin.file:
        path: "{{ __ca_publish_stage.path }}"
        state: absent
      when:
        - __ca_publish_stage is defined
        - __ca_publish_stage.path is defined
      delegate_to: localhost
      check_mode: false
      changed_when: false

    - name: "CA | Remove remote publish staging directory"
      become: true
      become_user: "{{ ca_owner }}"
      ansible.builtin.file:
        path: "{{ __ca_publish_remote_stage.path }}"
        state: absent
      when:
        - __ca_publish_remote_stage is defined
        - __ca_publish_remote_stage.path is defined
      check_mode: false
      changed_when: false
