---
# role: ca
# file: tasks/assert.yml

- name: assert | Validate the PKI path component
  ansible.builtin.assert:
    that:
      - ca_name not in ['', '.', '..']
      - ca_name is not search('[\s/\\\\]')
    fail_msg: ca_name must be a nonempty path component without whitespace or path separators.
    quiet: true
  tags:
    - ca_init
    - ca_init_dirs
    - ca_authorities
    - ca_create
    - ca_crl
    - ca_publish

- name: assert | Validate revocation authority names
  ansible.builtin.assert:
    that:
      - ca_revocations.keys() | difference(ca_authorities | map(attribute='name')) | length == 0
    fail_msg: ca_revocations keys must match managed authority names.
    quiet: true
  tags: ca_crl

- name: assert | Validate unique certificate names
  ansible.builtin.assert:
    that:
      - ca_certificates | map(attribute='name') | unique | length == ca_certificates | length
    fail_msg: ca_certificates need unique names.
    quiet: true
  tags: ca_create

- name: assert | Validate publish inventory hosts
  ansible.builtin.assert:
    that:
      - __ca_publish_target.name in hostvars
    fail_msg: "Publish target {{ __ca_publish_target.name }} must reference an inventory host."
    quiet: true
  loop: "{{ ca_publish_targets }}"
  loop_control:
    loop_var: __ca_publish_target
    label: "{{ __ca_publish_target.name }}"
  tags: ca_publish
