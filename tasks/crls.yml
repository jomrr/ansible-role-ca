---
# role: ca
# file: tasks/crls.yml

- name: "CA | Manage authority CRLs"
  become: true
  become_user: "{{ ca_owner }}"
  jomrr.ca.crl_batch:
    base_dir: "{{ ca_base_dir }}"
    base_url: "{{ ca_base_url }}"
    ca_name: "{{ ca_name }}"
    authorities: "{{ ca_authorities }}"
    revocations: "{{ ca_revocations }}"
    renew_before_days: "{{ ca_crl_renew_before_days }}"
    owner: "{{ ca_owner }}"
    group: "{{ ca_group }}"
    force: "{{ ca_force_reissue | bool }}"
  no_log: true
