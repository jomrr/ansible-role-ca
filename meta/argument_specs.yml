---
# role: ca
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Manage a two-tier private certificate authority.
    description:
      - Creates and manages a Root CA plus Component, Network, and Identity issuing CAs.
      - Issues declared certificates, CRLs, embeds AIA/CDP URLs, writes a non-secret CA
        inventory, and optionally publishes public AIA/CDP artifacts.
      - Authority definitions configure the CA topology. Certificate type overrides select
        default issuers; individual certificates may override their issuer. Cryptographic
        profile and format defaults belong to the collection.
    options:
      ca_name:
        type: str
        required: false
        default: Yourdomain
        description:
          - CA name used in CA certificate common names and, lowercased, in the default
            CA working directory.
          - Must not be empty, `.` or `..`, or contain whitespace or path separators.
      ca_base_dir:
        type: str
        required: false
        description:
          - CA working directory.
          - Defaults to `/etc/pki/<ca_name | lower>` on RedHat-family systems and `/etc/ssl/<ca_name
            | lower>` on Debian and Suse-family systems.
      ca_base_url:
        type: str
        required: false
        default: http://pki.yourdomain.tld
        description:
          - Base URL used when deriving default AIA and CDP URLs.
          - The default uses plain HTTP because AIA and CDP endpoints should be reachable
            without TLS bootstrapping.
      ca_kerberos_realm:
        type: str
        required: false
        default: ''
        description: Optional default Kerberos realm for MSKDC PKINIT SAN encoding.
      ca_owner:
        type: str
        required: false
        default: root
        description: Owner for managed CA files.
      ca_group:
        type: str
        required: false
        default: root
        description: Group for managed CA files.
      ca_subject:
        type: dict
        required: false
        default:
          country: DE
          state: Bayern
          locality: Erlangen
          organization: '{{ ca_name }} SE'
          organizational_unit: '{{ ca_name }} Certificate Authority'
        description: Default X.509 subject attributes added before the certificate common
          name.
        options:
          country:
            type: str
            required: false
            description: X.509 subject country.
          state:
            type: str
            required: false
            description: X.509 subject state or province.
          locality:
            type: str
            required: false
            description: X.509 subject locality.
          organization:
            type: str
            required: false
            description: X.509 subject organization.
          organizational_unit:
            type: str
            required: false
            description: X.509 subject organizational unit.
      ca_force_reissue:
        type: bool
        required: false
        default: false
        description: Force regeneration of authority and certificate keys, certificates,
          CRLs, and exports.
      ca_renewal:
        type: dict
        required: false
        default:
          warn_before_days: 30
          renew_before_days: 7
          renew_at: ''
          rekey: false
        description:
          - Default renewal policy for managed authorities and certificates.
          - '`warn_before_days` controls the renewal warning calculated when reading inventory;
            it does not renew certificates or trigger inventory writes.'
          - '`renew_before_days` renews when the existing certificate reaches that remaining-validity
            window; defaults to 7 days.'
          - '`renew_at` renews once at or after a scheduled ISO-8601 or `YYYYMMDDHHMMSSZ`
            timestamp, but only for certificates issued before that timestamp.'
          - '`rekey=true` generates a new private key when renewal is triggered; otherwise
            renewal keeps the existing key.'
          - Replaced managed certificate generations are archived below `<ca_base_dir>/archive`.
        options:
          warn_before_days:
            type: int
            required: false
            default: 30
            description: Remaining-validity warning window in days.
          renew_before_days:
            type: int
            required: false
            default: 7
            description: Remaining-validity renewal window in days. `0` disables automatic
              window renewal.
          renew_at:
            type: str
            required: false
            default: ''
            description: Optional scheduled renewal timestamp as ISO-8601 or `YYYYMMDDHHMMSSZ`.
          rekey:
            type: bool
            required: false
            default: false
            description: Generate a new private key when renewal is due.
      ca_authorities:
        type: list
        elements: dict
        required: false
        description: Managed CA topology. Store real `key_passphrase` values in Ansible
          Vault.
        options:
          name:
            type: str
            required: true
            description: Authority identifier and CA file stem.
          formats:
            type: list
            elements: str
            description:
              - Authority certificate exports; defaults to `pem,der,txt` in the collection.
              - Add `cer` for DER bytes with a `.cer` extension. Authority chains use `pem,der,txt`
                independently.
          common_name:
            type: str
            description: Authority certificate common name; required unless `subject_ordered`
              supplies the complete subject.
          subject_ordered:
            type: list
            elements: dict
            description: Full ordered subject as single-attribute dictionaries, overriding
              `subject`, `common_name`, and `email`.
          email:
            type: str
            description: Optional subject email address.
          subject:
            type: dict
            required: false
            description: Optional authority subject attribute overrides merged with `ca_subject`.
          basic_constraints:
            type: list
            elements: str
            description: Optional Basic Constraints tokens, such as `CA:TRUE` and `pathlen:0`;
              omitted values use collection defaults.
          key_usage:
            type: list
            elements: str
            description: Optional Key Usage tokens overriding collection defaults.
          key_usage_critical:
            type: bool
            description: Mark Key Usage critical; defaults to true in the collection.
          extended_key_usage:
            type: list
            elements: str
            description: Optional Extended Key Usage overrides; an empty list omits the
              extension.
          extended_key_usage_critical:
            type: bool
            description: Mark Extended Key Usage critical; defaults to false in the collection.
          san:
            type: list
            elements: str
            description: Optional authority Subject Alternative Name entries in OpenSSL-style
              syntax.
          san_critical:
            type: bool
            description: Mark Subject Alternative Name critical; defaults to false in the
              collection.
          aia_base_url:
            type: str
            description: Override the AIA URL prefix; the collection appends the issuer
              certificate filename, including its generation when applicable.
          cdp_base_url:
            type: str
            description: Override the CDP URL prefix; the collection appends the issuer
              CRL filename, including its generation when applicable.
          raw_extensions:
            type: list
            elements: dict
            description: Additional unrecognized extensions as dictionaries containing `oid`,
              `value`, and optional `critical`.
          pkinit:
            type: dict
            description: PKINIT context used by the collection to encode SAN otherName entries.
          include_identifiers:
            type: bool
            description: Include Subject Key Identifier and Authority Key Identifier; defaults
              to true in the collection.
          key_mode:
            type: str
            description: Private key and private export permissions; defaults to `0600`
              in the collection.
          public_mode:
            type: str
            description: CSR, certificate, and public export permissions; defaults to `0644`
              in the collection.
          key_type:
            type: str
            required: false
            choices:
              - RSA
              - ECDSA
              - P-256
              - P-384
              - Ed25519
              - Ed448
              - EC
              - P256
              - P384
              - ECDSA_P256
              - ECDSA_P384
              - EC_P256
              - EC_P384
              - prime256v1
              - secp256r1
              - secp384r1
              - ED25519
              - ED448
              - EdDSA25519
              - EdDSA448
            description: Optional authority key type. Supported values include `RSA`, `ECDSA`,
              `P-256`, `P-384`, `Ed25519`, and `Ed448`; defaults to `RSA`.
          key_size:
            type: int
            required: false
            description: Optional authority key size. RSA defaults to `4096`; ECDSA accepts
              `256` or `384`; Ed25519 and Ed448 do not use a key size.
          digest:
            type: str
            required: false
            default: sha384
            choices:
              - sha224
              - sha256
              - sha384
              - sha512
            description:
              - Hash for this authority's certificate and CSR signatures. SHA-1 is forbidden.
              - Ed25519 and Ed448 signing keys determine their own hash; this setting has
                no effect on those signatures.
              - Changing the effective signature algorithm reissues the certificate or CSR
                while retaining the key.
          parent:
            type: str
            required: true
            description: Parent authority name. Set this to the same value as `name` for
              a self-signed authority.
          days:
            type: int
            required: true
            description: Authority certificate validity in days.
          default_days:
            type: int
            description: Default validity in days for issued certificates; required when
              an issued certificate omits `days`.
          crl_days:
            type: int
            required: true
            description: CRL validity in days.
          crl_renew_before_days:
            type: float
            required: false
            description: Optional CRL renewal window in days, overriding `ca_crl_renew_before_days`.
              Must be nonnegative and less than `crl_days`.
          renewal:
            type: dict
            required: false
            description: Authority renewal policy override merged with `ca_renewal`.
            options:
              warn_before_days:
                type: int
                description: Remaining-validity warning window in days.
              renew_before_days:
                type: int
                description: Remaining-validity renewal window in days.
              renew_at:
                type: str
                description: Optional scheduled renewal timestamp.
              rekey:
                type: bool
                description: Generate a new private key when renewal is due.
          key_passphrase:
            type: str
            required: true
            no_log: true
            description: Authority private key passphrase.
          parent_key_passphrase:
            type: str
            no_log: true
            description: Accepted parent credential metadata; authority batches resolve
              the actual credential from the matching parent entry.
          legacy_generation:
            type: str
            description: Optional legacy publication generation identity used by the collection.
          archived_key_passphrases:
            type: dict
            no_log: true
            description: Archived issuer generation IDs mapped to their private key passphrases
              for CRL renewal.
          certificate_policies:
            type: list
            elements: dict
            default: []
            description:
              - Explicit certificate policy OIDs with optional CPS URLs; emitted as a noncritical
                extension.
              - Policy-bearing issuers require each end certificate to contain a nonempty
                subset of their OIDs.
              - No policy inheritance or automatic assignment from certificate profiles.
            options:
              oid:
                type: str
                required: true
                description: Policy OID. `2.5.29.32.0` (anyPolicy) is only supported on
                  self-signed roots.
              cps_uri:
                type: str
                description: Optional absolute HTTP or HTTPS URL of the CPS document.
          policy_constraints:
            type: dict
            default: {}
            description:
              - Optional critical constraints for sub-CAs with a nonempty certificate_policies
                list.
              - Omitted counters emit no constraint; `0` activates the constraint immediately.
              - Not supported on roots or end certificates.
            options:
              require_explicit_policy:
                type: int
                description: Nonnegative number of additional certificates before a nonempty
                  valid policy set is required.
              inhibit_policy_mapping:
                type: int
                description: Nonnegative number of additional certificates before policy
                  mapping is inhibited.
          inhibit_any_policy:
            type: raw
            description:
              - Optional critical anyPolicy inhibition counter for sub-CAs with certificate_policies.
              - Must be nonnegative; `0` activates immediately. Not supported on roots or
                end certificates.
          crl_digest:
            type: str
            required: false
            default: sha384
            choices:
              - sha224
              - sha256
              - sha384
              - sha512
            description: CRL signature hash. SHA-1 is forbidden; Ed25519 and Ed448 signing
              keys determine their own hash.
      ca_crl_renew_before_days:
        type: float
        required: false
        default: 7
        description:
          - Renew CRLs this many days before nextUpdate, even when revocations are unchanged.
          - Must be nonnegative and less than the authority `crl_days`; fractional days
            are supported.
          - An authority may override this window with `crl_renew_before_days`.
          - Run the role more frequently than the renewal window, allowing time for publication.
      ca_revocations:
        type: dict
        required: false
        default:
          root: []
          component: []
          network: []
          identity: []
        description:
          - Revoked certificate entries keyed by issuing authority name.
          - Missing authority keys declare no new revocations; previously recorded revocations
            remain in CRLs.
          - Each list item must identify one certificate by `name`, `certificate_name`,
            `fingerprint`, `sha1`, `sha256`, `serial_number`, or `serial`.
          - Names and fingerprints are resolved from the managed CA inventory; serial numbers
            can be decimal, `0x` hex, or colon-separated hex.
          - A name is permanently bound to the issuer and serial of its first revoked generation.
            Reissuing the name does not revoke the replacement; use its serial or fingerprint
            to revoke that generation.
          - Removing an entry does not undo a recorded revocation. An omitted `revocation_date`
            retains the first revocation time.
          - Optional item fields are `reason`, `revocation_date`, and `invalidity_date`.
          - Supported reasons are `key_compromise`, `ca_compromise`, `affiliation_changed`,
            `superseded`, `cessation_of_operation`, `certificate_hold`, `privilege_withdrawn`,
            and `aa_compromise`.
          - PEM and DER CRLs are regenerated from one shared CRL object, so both formats
            have identical CRL Number, AKI, timestamps, and revoked entries.
      ca_certificate_types:
        type: dict
        default: {}
        description:
          - Partial overrides of the built-in certificate type issuer assignments.
          - Overrides are merged recursively with the role defaults, independently of Ansible
            hash_behaviour.
          - Unspecified types and fields retain their defaults. An explicit certificate
            issuer takes precedence.
          - TLS server, TLS client, MSKDC and FritzBox default to component; Identity profiles
            to identity; EAP-TLS to network.
        options:
          tls_server:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          tls_client:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          mskdc:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          fritzbox:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          identity_full:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          identity:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
          eap_tls_client:
            type: dict
            description: Optional issuer override for this certificate type.
            options:
              issuer:
                type: str
                description: Name of a managed authority used as the default issuer for
                  this type.
      ca_certificates:
        type: list
        elements: dict
        required: false
        default: []
        description: Certificates to manage.
        options:
          name:
            type: str
            required: true
            description: Certificate identifier and default file stem.
          type:
            type: str
            required: true
            choices:
              - tls_server
              - tls_client
              - mskdc
              - fritzbox
              - identity_full
              - identity
              - eap_tls_client
            description: Built-in certificate profile to use.
          issuer:
            type: str
            description:
              - Managed authority overriding this certificate type's effective issuer.
              - Omit or set to null to use the type default; an empty name is invalid.
              - Issuer validity and policy compatibility are checked by the collection.
          formats:
            type: list
            elements: str
            required: false
            description:
              - Optional output format override passed to the certificate module.
              - Defaults are module-owned. Standard certificates and MSKDC default to `pem,der,txt`;
                Identity defaults to `pem,der,txt,pfx`; FritzBox defaults to `pem,der,txt,fritzbox`.
              - Add `fullchain` to create a certificate plus issuing-chain PEM bundle.
              - Add `cer` for DER bytes with a `.cer` extension, independently of `der`.
              - Add `bundle` for `<name>-bundle.pem`, excluding the self-signed root.
              - PKCS#8 bundles contain certificate, private key, then intermediates; traditional
                bundles place the private key last.
              - CSR-signed certificates support `pem`, `der`, `cer`, `txt`, and `fullchain`.
          bundle_key_format:
            type: str
            choices:
              - pkcs8
              - traditional
            description:
              - Private key encoding for `bundle` only; defaults to `pkcs8` in the collection.
              - '`traditional` supports RSA and ECDSA; Ed25519 and Ed448 require `pkcs8`.'
              - Encryption follows `key_passphrase`; the managed key and FritzBox export
                are unchanged.
          common_name:
            type: str
            description:
              - Certificate common name; required for locally generated certificate keys.
              - For external CSRs, provide `common_name` or an approved `subject_ordered`;
                an explicit common name must match the CSR common name.
          subject_ordered:
            type: list
            elements: dict
            description: Full ordered subject as single-attribute dictionaries, overriding
              `subject`, `common_name`, and `email`.
          basic_constraints:
            type: list
            elements: str
            description: Optional Basic Constraints tokens, such as `CA:TRUE` and `pathlen:0`;
              omitted values use collection defaults.
          key_usage:
            type: list
            elements: str
            description: Optional Key Usage tokens overriding collection defaults.
          key_usage_critical:
            type: bool
            description: Mark Key Usage critical; defaults to true in the collection.
          extended_key_usage:
            type: list
            elements: str
            description: Optional Extended Key Usage overrides; an empty list omits the
              extension.
          extended_key_usage_critical:
            type: bool
            description: Mark Extended Key Usage critical; defaults to false in the collection.
          san_critical:
            type: bool
            description: Mark Subject Alternative Name critical; defaults to false in the
              collection.
          aia_base_url:
            type: str
            description: Override the AIA URL prefix; the collection appends the issuer
              certificate filename, including its generation when applicable.
          cdp_base_url:
            type: str
            description: Override the CDP URL prefix; the collection appends the issuer
              CRL filename, including its generation when applicable.
          raw_extensions:
            type: list
            elements: dict
            description: Additional unrecognized extensions as dictionaries containing `oid`,
              `value`, and optional `critical`.
          pkinit:
            type: dict
            description: PKINIT context used by the collection to encode SAN otherName entries.
          include_identifiers:
            type: bool
            description: Include Subject Key Identifier and Authority Key Identifier; defaults
              to true in the collection.
          key_mode:
            type: str
            description: Private key and private export permissions; defaults to `0600`
              in the collection.
          public_mode:
            type: str
            description: CSR, certificate, and public export permissions; defaults to `0644`
              in the collection.
          policy_constraints:
            type: dict
            default: {}
            description:
              - Optional critical constraints for sub-CAs with a nonempty certificate_policies
                list.
              - Omitted counters emit no constraint; `0` activates the constraint immediately.
              - Not supported on roots or end certificates.
            options:
              require_explicit_policy:
                type: int
                description: Nonnegative number of additional certificates before a nonempty
                  valid policy set is required.
              inhibit_policy_mapping:
                type: int
                description: Nonnegative number of additional certificates before policy
                  mapping is inhibited.
          inhibit_any_policy:
            type: raw
            description:
              - Optional critical anyPolicy inhibition counter for sub-CAs with certificate_policies.
              - Must be nonnegative; `0` activates immediately. Not supported on roots or
                end certificates.
          certificate_policies:
            type: list
            elements: dict
            default: []
            description:
              - Explicit certificate policy OIDs with optional CPS URLs; emitted as a noncritical
                extension.
              - Policy-bearing issuers require each end certificate to contain a nonempty
                subset of their OIDs.
              - No policy inheritance or automatic assignment from certificate profiles.
            options:
              oid:
                type: str
                required: true
                description: Policy OID. `2.5.29.32.0` (anyPolicy) is only supported on
                  self-signed roots.
              cps_uri:
                type: str
                description: Optional absolute HTTP or HTTPS URL of the CPS document.
          csr_path:
            type: path
            required: false
            description:
              - Path to a PEM CSR on the managed CA host.
              - Mutually exclusive with `csr_content`.
              - The CSR supplies the public key; subject attributes and SANs come from the
                approved configuration, not from the CSR.
          csr_content:
            type: str
            required: false
            description:
              - Inline PEM CSR content.
              - Mutually exclusive with `csr_path`.
              - The CSR supplies the public key; subject attributes and SANs come from the
                approved configuration, not from the CSR.
          subject:
            type: dict
            required: false
            description: Optional certificate subject attribute overrides merged with `ca_subject`.
          email:
            type: str
            required: false
            description: Optional subject email address.
          san:
            type: list
            elements: str
            required: false
            description:
              - Approved Subject Alternative Name entries in OpenSSL-style syntax; CSR SANs
                are not inherited.
              - Omitted values use profile defaults; an empty list disables optional SAN
                defaults. MSKDC still adds its required PKINIT SAN.
          krb5_realm:
            type: str
            required: false
            description: Required for `mskdc` unless `ca_kerberos_realm` is set; Kerberos
              realm encoded as `krbtgt/<REALM>@<REALM>` in the PKINIT SAN.
          ad_object_guid:
            type: str
            required: false
            description: Optional for `mskdc`; AD objectGUID of the domain controller, as
              canonical GUID or raw 16-byte hex.
          days:
            type: int
            required: false
            description: Per-certificate validity override.
          output_dir:
            type: path
            required: false
            description: Optional certificate-specific output directory.
          directory_mode:
            type: str
            description: Certificate export directory permissions; defaults to `0755` in
              the collection.
          publish_private:
            type: bool
            default: false
            description:
              - Allow `jomrr.ca.artifacts` to list the local private key and requested private
                exports with `secret=true`.
              - Consumer metadata only; does not create additional exports or publish private
                files through this role's AIA/CDP targets.
          key_type:
            type: str
            required: false
            choices:
              - RSA
              - ECDSA
              - P-256
              - P-384
              - Ed25519
              - Ed448
              - EC
              - P256
              - P384
              - ECDSA_P256
              - ECDSA_P384
              - EC_P256
              - EC_P384
              - prime256v1
              - secp256r1
              - secp384r1
              - ED25519
              - ED448
              - EdDSA25519
              - EdDSA448
            description: Optional certificate key type. Supported values include `RSA`,
              `ECDSA`, `P-256`, `P-384`, `Ed25519`, and `Ed448`; defaults to `RSA`.
          key_size:
            type: int
            required: false
            description: Optional certificate key size. RSA defaults to `4096`; ECDSA accepts
              `256` or `384`; Ed25519 and Ed448 do not use a key size.
          digest:
            type: str
            required: false
            default: sha384
            choices:
              - sha224
              - sha256
              - sha384
              - sha512
            description:
              - Hash for the certificate signature and locally generated CSR. SHA-1 is forbidden;
                FritzBox excludes sha512.
              - The issuer key determines the certificate signature algorithm; Ed25519 and
                Ed448 have no separate hash selection.
              - Changing the effective signature algorithm reissues the certificate or CSR
                while retaining the key.
          key_passphrase:
            type: str
            required: false
            no_log: true
            description: Optional private key passphrase for CA-generated certificate keys.
              Ignored for CSR-signed certificates.
          pfx_passphrase:
            type: str
            required: false
            no_log: true
            description: PFX/PKCS#12 export passphrase.
          passphrase:
            type: str
            no_log: true
            description: Alternate PKCS#12 export passphrase, taking precedence over `pfx_passphrase`.
          pfx_friendly_name:
            type: str
            required: false
            description: PKCS#12 friendly name; defaults to the common name or object name.
              `friendly_name` remains an alias.
          friendly_name:
            type: str
            description: Alias for `pfx_friendly_name`, resolved by the collection.
          pfx_encryption:
            type: str
            choices:
              - best
              - compatibility2022
            description:
              - Encryption for `pfx` and `p12`; defaults to the library's BestAvailableEncryption
                (`best`).
              - '`compatibility2022` uses legacy PBES1 SHA-1 with 3-key TripleDES-CBC and
                a SHA-1 MAC; select only for devices requiring it.'
              - This export setting does not permit SHA-1 certificate or CRL signatures.
          pfx_iterations:
            type: int
            description:
              - Optional encryption KDF iteration count from 1 to 2147483647; does not set
                the separate MAC iteration count.
              - When omitted, new exports use the library default and existing iteration
                counts are accepted.
          renewal:
            type: dict
            required: false
            description: Certificate renewal policy override merged with `ca_renewal`.
          fritzbox_deploy:
            type: dict
            required: false
            description:
              - Optional FRITZ!OS deployment settings for FritzBox certificates.
              - Deployment runs only when `enabled=true` and the effective formats include
                `fritzbox`.
              - The module compares the desired certificate with the current FRITZ!Box HTTPS
                certificate and uploads only when they differ, unless `ca_force_reissue=true`.
            options:
              enabled:
                type: bool
                required: false
                default: false
                description: Enable deployment to a FRITZ!Box.
              url:
                type: str
                required: false
                default: https://fritz.box
                description:
                  - FRITZ!Box deployment URL.
                  - HTTPS is required for the default idempotent certificate comparison;
                    `ca_force_reissue=true` skips that comparison and uploads directly.
              username:
                type: str
                required: false
                description: FRITZ!OS user name.
              password:
                type: str
                required: false
                no_log: true
                description: FRITZ!OS password.
              timeout:
                type: int
                required: false
                default: 30
                description: HTTP request timeout in seconds.
              validate_certs:
                type: bool
                required: false
                default: false
                description: Validate HTTPS certificates for the FRITZ!Box connection.
      ca_publish_targets:
        type: list
        elements: dict
        required: false
        default: []
        description:
          - Optional inventory hosts for public AIA/CDP artifact publishing, including the
            CA host itself.
          - Each target receives CA certificates and issuing chains below `path/aia`, and
            CRLs below `path/crl`.
          - Declare multiple targets when the same AIA/CDP URLs are served from multiple
            hosts, for example in Split-DNS setups.
        options:
          name:
            type: str
            required: true
            description:
              - Existing inventory hostname receiving the files. Use `inventory_hostname`
                to publish on the CA host itself.
              - Connection settings come from that host's inventory variables.
          path:
            type: str
            required: true
            description: Remote webroot directory that receives `aia` and `crl` subdirectories.
          owner:
            type: str
            required: false
            description: Owner for published files and directories. Defaults to `ca_owner`.
          group:
            type: str
            required: false
            description: Group for published files and directories. Defaults to `ca_group`.
          mode:
            type: str
            required: false
            description: Published file mode. Defaults to `ca_publish_mode`.
          directory_mode:
            type: str
            required: false
            description: Published directory mode. Defaults to `ca_publish_directory_mode`.
          become:
            type: bool
            required: false
            description: Privilege escalation setting for this target.
          become_user:
            type: str
            required: false
            description: Privilege escalation user for this target.
      ca_publish_directory_mode:
        type: str
        required: false
        default: '0755'
        description: Default directory mode for published AIA/CDP directories.
      ca_publish_mode:
        type: str
        required: false
        default: '0644'
        description: Default file mode for published AIA/CDP artifacts.
