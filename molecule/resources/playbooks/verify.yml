---
# role: ca
# file: molecule/resources/playbooks/verify.yml

- name: "CA | Verify CA artifacts"
  hosts: all
  gather_facts: true
  vars:
    __ca_molecule_base: "{{ (ansible_facts.os_family == 'RedHat') | ternary('/etc/pki', '/etc/ssl') }}/{{ ca_name | lower }}"
  tasks:
    - name: "CA | Load role certificate type vars"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../vars/main.yml"

    - name: "CA | Install policy verification dependency"
      become: true
      become_user: root
      ansible.builtin.package:
        name: openssl
        state: present

    - name: "CA | Verify generated CA artifacts"
      ca_verify:
        ca_name: "{{ ca_name }}"
        base_dir: "{{ __ca_molecule_base }}"
        publish_root: /var/www/pki
        publish_mode: "{{ ca_publish_targets[0].mode }}"
        authorities: "{{ ca_authorities }}"
        certificates: "{{ ca_certificates }}"
        certificate_types: "{{ ca_certificate_types }}"
        subject: "{{ ca_subject }}"
        revocations: "{{ ca_revocations }}"
        renewal: "{{ ca_renewal }}"

    - name: "CA | Verify publishing to another inventory host"
      when: ca_publish_targets | length > 1
      block:
        - name: "CA | Read locally published certificate and CRL checksums"
          ansible.builtin.stat:
            path: "/var/www/pki/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - aia/root-ca.der
            - crl/component-ca.crl
          register: __ca_molecule_public_sources

        - name: "CA | Read artifacts on the remote inventory target"
          ansible.builtin.stat:
            path: "{{ ca_publish_targets[1].path }}/{{ item.item }}"
            checksum_algorithm: sha256
          delegate_to: "{{ ca_publish_targets[1].name }}"
          loop: "{{ __ca_molecule_public_sources.results }}"
          loop_control:
            label: "{{ item.item }}"
          register: __ca_molecule_public_copies

        - name: "CA | Verify remote artifacts belong to the source CA"
          ansible.builtin.assert:
            that:
              - item.stat.isreg
              - item.stat.checksum == item.item.stat.checksum
              - item.stat.mode == ca_publish_targets[1].mode
            quiet: true
          loop: "{{ __ca_molecule_public_copies.results }}"
          loop_control:
            label: "{{ item.item.item }}"
