---
# role: ca
# file: molecule/resources/playbooks/verify.yml

- name: Verify CA artifacts
  hosts: all
  gather_facts: false
  tasks:
    - name: Load CA platform settings
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: set_vars
        public: true

    - name: Install policy verification dependency
      become: true
      become_user: root
      ansible.builtin.package:
        name: openssl
        state: present

    - name: Verify generated CA artifacts
      ca_verify:
        ca_name: "{{ ca_name }}"
        base_dir: "{{ __ca_base_dir }}"
        publish_root: /var/www/pki
        publish_mode: "{{ ca_publish_targets[0].mode }}"
        authorities: "{{ ca_authorities }}"
        certificates: "{{ ca_certificates }}"
        certificate_types:
          tls_server: {issuer: component}
          tls_client: {issuer: component}
          mskdc: {issuer: component}
          fritzbox: {issuer: component}
          identity_full: {issuer: identity}
          identity: {issuer: identity}
          eap_tls_client: {issuer: component}
        subject: "{{ ca_subject }}"
        revocations: "{{ ca_revocations }}"
        renewal: "{{ ca_renewal }}"

    - name: "Read locally published certificate and CRL checksums"
      ansible.builtin.stat:
        path: "/var/www/pki/{{ __ca_source_file }}"
        checksum_algorithm: sha256
      loop:
        - aia/root-ca.der
        - crl/component-ca.crl
      loop_control:
        loop_var: __ca_source_file
        label: "{{ __ca_source_file }}"
      register: __ca_molecule_public_sources

    - name: "Read local and remote publish directory modes"
      ansible.builtin.stat:
        path: "{{ __ca_directory_pair.0.path }}/{{ __ca_directory_pair.1 }}"
      delegate_to: "{{ __ca_directory_pair.0.name }}"
      loop: "{{ ca_publish_targets | product(['', 'aia', 'crl']) | list }}"
      loop_control:
        loop_var: __ca_directory_pair
        label: "{{ __ca_directory_pair.0.name }}/{{ __ca_directory_pair.1 }}"
      register: __ca_molecule_publish_directories

    - name: "Verify target directory modes"
      ansible.builtin.assert:
        that:
          - __ca_directory_result.stat.isdir
          - __ca_directory_result.stat.mode == __ca_directory_result.__ca_directory_pair.0.directory_mode
        quiet: true
      loop: "{{ __ca_molecule_publish_directories.results }}"
      loop_control:
        loop_var: __ca_directory_result
        label: "{{ __ca_directory_result.__ca_directory_pair.0.name }}/{{ __ca_directory_result.__ca_directory_pair.1 }}"

    - name: "Read artifacts on remote inventory targets"
      ansible.builtin.stat:
        path: "{{ __ca_artifact_pair.0.path }}/{{ __ca_artifact_pair.1.__ca_source_file }}"
        checksum_algorithm: sha256
      delegate_to: "{{ __ca_artifact_pair.0.name }}"
      loop: "{{ ca_publish_targets[1:] | product(__ca_molecule_public_sources.results) | list }}"
      loop_control:
        loop_var: __ca_artifact_pair
        label: "{{ __ca_artifact_pair.0.name }}/{{ __ca_artifact_pair.1.__ca_source_file }}"
      register: __ca_molecule_public_copies

    - name: "Verify remote artifacts belong to the source CA"
      ansible.builtin.assert:
        that:
          - __ca_artifact_result.stat.isreg
          - __ca_artifact_result.stat.checksum == __ca_artifact_result.__ca_artifact_pair.1.stat.checksum
          - __ca_artifact_result.stat.mode == __ca_artifact_result.__ca_artifact_pair.0.mode
        quiet: true
      loop: "{{ __ca_molecule_public_copies.results }}"
      loop_control:
        loop_var: __ca_artifact_result
        label: "{{ __ca_artifact_result.__ca_artifact_pair.0.name }}/{{ __ca_artifact_result.__ca_artifact_pair.1.__ca_source_file }}"
