---
# role: ca
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 12
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
  env:
    ANSIBLE_MODULE_UTILS: "${MOLECULE_PROJECT_DIRECTORY}/module_utils:${MOLECULE_PROJECT_DIRECTORY}/molecule/resources/playbooks/module_utils"
  inventory:
    group_vars:
      all:
        ca_name: "Example"
        ca_base_url: "http://pki.molecule.test"
        ca_publish_targets:
          - name: "{{ inventory_hostname }}"
            path: "/var/www/pki"
            mode: "0640"
        ca_renewal:
          warn_before_days: 400
          renew_before_days: 7
          renew_at: ""
          rekey: false
        ca_authorities:
          - name: "root"
            common_name: "Example Root CA"
            parent: "root"
            days: 3652
            default_days: 397
            crl_days: 30
            key_passphrase: "molecule-root-passphrase"
            digest: "sha512"
            crl_digest: "sha224"
          - name: "component"
            common_name: "Example Component CA"
            parent: "root"
            days: 1826
            default_days: 397
            crl_days: 30
            key_passphrase: "molecule-component-passphrase"
            key_type: "P-384"
            digest: "sha256"
            crl_digest: "sha512"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.1"
                cps_uri: "https://pki.molecule.test/cps"
              - oid: "1.3.6.1.4.1.32473.1.1.2"
            policy_constraints:
              require_explicit_policy: 0
              inhibit_policy_mapping: 0
            inhibit_any_policy: 0
          - name: "network"
            common_name: "Example Network CA"
            parent: "root"
            days: 1826
            default_days: 397
            crl_days: 30
            key_passphrase: "molecule-network-passphrase"
            key_type: "Ed25519"
          - name: "identity"
            common_name: "Example Identity CA"
            parent: "root"
            days: 1826
            default_days: 730
            crl_days: 30
            key_passphrase: "molecule-identity-passphrase"
            key_type: "Ed448"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.3"
        ca_revocations:
          component:
            - name: "web01"
              reason: "key_compromise"
              invalidity_date: "2026-06-14T00:00:00Z"
        ca_certificates:
          - name: "web01"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.1"
                cps_uri: "https://pki.molecule.test/cps/1"
            type: "tls_server"
            common_name: "web01.molecule.test"
            formats:
              - "pem"
              - "der"
              - "txt"
              - "fullchain"
            san:
              - "DNS:web01.molecule.test"
              - "DNS:web01"
          - name: "client01"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.2"
                cps_uri: "https://pki.molecule.test/cps/2"
            type: "tls_client"
            common_name: "client01.molecule.test"
          - name: "external-csr"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.1"
                cps_uri: "https://pki.molecule.test/cps/1"
            type: "tls_server"
            formats:
              - "pem"
              - "der"
              - "txt"
              - "fullchain"
            csr_content: |-
              -----BEGIN CERTIFICATE REQUEST-----
              MIICsDCCAZgCAQAwJTEjMCEGA1UEAwwaZXh0ZXJuYWwtY3NyLm1vbGVjdWxlLnRl
              c3QwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQCyxE7u0BNCBFKmcvwa
              HNifDexDukFYlUxMy9zSxRx0i7KKEOXA4xsnH3NwdKZALoI62MMQbOT4dtdXm7bE
              YLuTKT9a0RSzsTSmVzoTTOj7tLh1vNXvKybihlUg+cQ0+zCmE3+ccCciHCYrG213
              HrL2HMhP/A2X2m/OuIweqBj8skGXPXBVQvhMANu+sY/RiaJ5uuyLQDj77Nh0FBCU
              3XJc6EeH6h8JF8uGXISnKT0M7smzBcmC3hdlKSgojlRldQW2BlxtGAQJCKpi8b2E
              F1ec2GZoszAOcTIRId80mTeEB+oVJWbxCDYUHxyaHC9/WbPOOfCG1l8jb9Sdirci
              VrU9AgMBAAGgRjBEBgkqhkiG9w0BCQ4xNzA1MDMGA1UdEQQsMCqCGmV4dGVybmFs
              LWNzci5tb2xlY3VsZS50ZXN0ggxleHRlcm5hbC1jc3IwDQYJKoZIhvcNAQELBQAD
              ggEBAB1dgRdjYUSTeu3V9ngH5U2pseLmXOr1UxpAN1XorUleg3VLjhOsupTruLzX
              1P7Rt8LdZ+6I+66wODmJignJfjFxO33dwPQx+iDaFgmVCKgKk61V5zijwQNLxpvk
              9Hd4Hy1j4n1f3lElKxKCQAZwa8Qc7tZPZQnPtJAUvOEQ8Wl0CFP794QsLZwOx4en
              jjn+xqUUP3AcXRojyH73t0W0wk+idcX/yQQ31A3EQQ7d1L8YCgATrkyrJrq6Aevh
              6OQ8gsQphZ5aR6KVBQLvHe71/FN1oN+5AABW+Nz7CCHZCU4XOtKHMd8AAGlCpsrw
              Qzu14PIaSg9rxeEweUeoBF3eWGU=
              -----END CERTIFICATE REQUEST-----
          - name: "ec-p256-client"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.2"
                cps_uri: "https://pki.molecule.test/cps/2"
            type: "tls_client"
            common_name: "ec-p256-client.molecule.test"
            digest: "sha256"
            key_type: "ECDSA"
            key_size: 256
          - name: "ec-p384-client"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.2"
                cps_uri: "https://pki.molecule.test/cps/2"
            type: "tls_client"
            common_name: "ec-p384-client.molecule.test"
            digest: "sha512"
            key_type: "ECDSA"
            key_size: 384
          - name: "ed25519-client"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.2"
                cps_uri: "https://pki.molecule.test/cps/2"
            type: "tls_client"
            common_name: "ed25519-client.molecule.test"
            digest: "sha224"
            key_type: "Ed25519"
          - name: "ed448-client"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.2"
                cps_uri: "https://pki.molecule.test/cps/2"
            type: "tls_client"
            common_name: "ed448-client.molecule.test"
            key_type: "Ed448"
          - name: "dc01"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.1"
                cps_uri: "https://pki.molecule.test/cps/1"
            type: "mskdc"
            common_name: "dc01.molecule.test"
            krb5_realm: "MOLECULE.TEST"
            ad_object_guid: "d900ea2b-1253-4754-a22b-cf28508dfed3"
            san:
              - "DNS:dc01.molecule.test"
              - "DNS:dc01"
          - name: "fritzbox01"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.1"
                cps_uri: "https://pki.molecule.test/cps/1"
            type: "fritzbox"
            common_name: "fritzbox.molecule.test"
            san:
              - "DNS:fritzbox.molecule.test"
              - "IP:192.0.2.1"
          - name: "user-full"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.3"
                cps_uri: "https://pki.molecule.test/cps/3"
            type: "identity_full"
            common_name: "Molecule User Full"
            email: "user-full@molecule.test"
            san:
              - "email:user-full@molecule.test"
              - "otherName:1.3.6.1.4.1.311.20.2.3;UTF8:user-full@molecule.test"
            pfx_passphrase: "molecule-pfx-passphrase"
          - name: "user-smime"
            certificate_policies:
              - oid: "1.3.6.1.4.1.32473.1.1.3"
                cps_uri: "https://pki.molecule.test/cps/3"
            type: "identity"
            common_name: "Molecule User S/MIME"
            email: "user-smime@molecule.test"
            san:
              - "email:user-smime@molecule.test"
              - "otherName:1.3.6.1.4.1.311.20.2.3;UTF8:user-smime@molecule.test"
            pfx_passphrase: "molecule-smime-pfx-passphrase"
          - name: "wifi-user"
            type: "eap_tls_client"
            common_name: "wifi-user@molecule.test"
            san:
              - "email:wifi-user@molecule.test"
verifier:
  name: "ansible"
scenario:
  name: "dev"
platforms:
  - name: "almalinux-latest-ca"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "debian-latest-ca"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "fedora-latest-ca"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-leap-latest-ca"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-tumbleweed-latest-ca"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "ubuntu-latest-ca"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
